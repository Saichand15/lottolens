[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Long-lived cache for hashed JS/CSS bundles (Vite adds content hash to filenames)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache the large JSON data files for 4 hours — reduces bandwidth by ~90% for return visits
[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=14400, stale-while-revalidate=86400"

# Cache HTML with short TTL so deploys take effect quickly
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
